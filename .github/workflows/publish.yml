name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # Lets npm authenticate this workflow, so no token is stored

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # No shared cache in release builds
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs lint, tests and build first
      - run: npm publish
